name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev]" build
      - name: Verify tag, package version, and changelog
        run: python scripts/release_check.py "$GITHUB_REF_NAME"
      - name: Run offline test suite
        run: pytest -m "not network"
      - name: Build wheel and source archive
        run: python -m build
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appfit-${{ github.ref_name }}
          path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
