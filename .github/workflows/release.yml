name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,gui,package]"
      - name: Run offline and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not network"
      - name: Build application and disk image
        run: python scripts/build_macos_app.py
      - name: Verify and smoke-test bundle
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/appfit-smoke-config
        run: |
          APP_PATH="deployment/appfit-$(uname -m).app"
          codesign --verify --deep --strict "$APP_PATH"
          "$APP_PATH/Contents/MacOS/appfit" &
          APP_PID=$!
          sleep 5
          kill -0 "$APP_PID"
          kill "$APP_PID"
          wait "$APP_PID" || true
      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: appfit-dmg-${{ matrix.runner }}
          path: deployment/*.dmg

  release:
    needs: desktop
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev]" build
      - name: Verify tag, package version, and changelog
        run: python scripts/release_check.py "$GITHUB_REF_NAME"
      - name: Run offline test suite
        run: pytest -m "not network"
      - name: Build wheel and source archive
        run: python -m build
      - name: Collect disk images
        uses: actions/download-artifact@v7
        with:
          pattern: appfit-dmg-*
          merge-multiple: true
          path: dist
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appfit-${{ github.ref_name }}
          path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
