name: macOS App (unsigned test builds)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Install patched Python (security releases have no python.org Mac installer)
        run: |
          uv python install --python-downloads-json-url \
            https://raw.githubusercontent.com/astral-sh/uv/d041e5700a7bb39bff687ebbba4f6f6f2bda5cc8/crates/uv-python-managed/download-metadata.json \
            3.12.16
          uv venv --seed --python 3.12.16 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,gui,package]"
      - name: Run offline and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not network"
      - name: Build application and disk image
        run: python scripts/build_macos_app.py
      - name: Verify and smoke-test bundle
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/appfit-smoke-config
        run: |
          APP_PATH="deployment/appfit-$(uname -m).app"
          codesign --verify --deep --strict "$APP_PATH"
          "$APP_PATH/Contents/MacOS/appfit" --check-bundle-runtime \
            "$(pwd)/deployment/runtime-$(uname -m).json"
          cat "deployment/runtime-$(uname -m).json"
          "$APP_PATH/Contents/MacOS/appfit" &
          APP_PID=$!
          sleep 5
          kill -0 "$APP_PID"
          kill "$APP_PID"
          wait "$APP_PID" || true
      - name: Upload unsigned disk image
        uses: actions/upload-artifact@v7
        with:
          name: appfit-${{ matrix.runner }}-unsigned
          path: deployment/*.dmg
