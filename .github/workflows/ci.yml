name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Check resolved dependency inventory without installing
        run: uv lock --check --no-build --no-python-downloads

  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test without public-network cases
        run: pytest -m "not network"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  gui-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Install patched Python (security releases have no python.org Mac installer)
        run: |
          uv python install --python-downloads-json-url \
            https://raw.githubusercontent.com/astral-sh/uv/d041e5700a7bb39bff687ebbba4f6f6f2bda5cc8/crates/uv-python-managed/download-metadata.json \
            3.12.16
          uv venv --seed --python 3.12.16 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install GUI test dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Run GUI and workflow tests offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_gui.py tests/test_workflows.py
      - name: Verify desktop entry point
        run: python -c "from appfit.gui_main import main; assert callable(main)"
