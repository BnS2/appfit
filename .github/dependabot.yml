# Security updates only: version updates are off (limit 0). Every minor and
# patch security fix lands in one grouped PR, refreshed as new alerts arrive.
# Majors open alone: they are the ones whose notes need reading.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
