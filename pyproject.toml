[project]
name = "appfit"
version = "0.3.1"
description = "Get modern apps onto aged-out iOS devices via Apple's own last-compatible-version mechanism"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ios", "ipad", "app-store", "ipa", "ipatool"]
dependencies = [
    "requests>=2.31",
    "keyring>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
device = ["pymobiledevice3>=11.0"]
gui = ["PySide6>=6.8,<7", "pymobiledevice3>=11.0"]
package = ["PyInstaller>=6.15,<7"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/BnS2/appfit"
Repository = "https://github.com/BnS2/appfit.git"
Issues = "https://github.com/BnS2/appfit/issues"
Changelog = "https://github.com/BnS2/appfit/blob/main/CHANGELOG.md"

[project.scripts]
appfit = "appfit.cli:app"
appfit-gui = "appfit.gui_main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appfit = ["data/*.patch"]

[tool.setuptools.exclude-package-data]
appfit = ["bin/*/ipatool", "bin/*/manifest.json"]
